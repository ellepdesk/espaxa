substitutions:
  devicename: "raam-kantoor"
  # UART pins to the MCP2003A LIN transceiver (TXD = pin 4, RXD = pin 1)
  tx_pin: GPIO21
  rx_pin: GPIO20

esphome:
  name: ${devicename}
  friendly_name: ${devicename}

external_components:
  # Use the component from github
  # - source: github://ellepdesk/espaxa
  # Or from this checkout
  - source:
      type: local
      path: components

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret fallback_password

  # use manual ip for faster connect
  manual_ip:
    static_ip: 192.168.100.153
    gateway: 192.168.100.1
    subnet: 255.255.255.0
    dns1: 192.168.100.1

captive_portal:

# Logs go to the built-in USB serial, the UART pins are free for the AXA
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: uart_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 2

cover:
  - platform: espaxa
    id: my_axa
    name: None
    # Defaults, tune to your window
    # unlock_duration: 10s
    # open_duration: 50s
    # lock_duration: 45s
    # poll_interval: 30s
    # moving_poll_interval: 2s
    # release_before_close: true  # OPEN before CLOSE, releases the AXA
    lock:
      name: "Lock"

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
